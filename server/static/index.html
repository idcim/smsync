<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>SMSync 短信同步</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: #0d1117; color: #e6edf3; }
  header { position: sticky; top: 0; background: #161b22; padding: 12px 16px;
           display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #30363d; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #f85149; }
  .dot.on { background: #3fb950; }
  button { background: #1f6feb; color: #fff; border: 0; border-radius: 6px;
           padding: 8px 14px; font-size: 14px; cursor: pointer; }
  main { max-width: 720px; margin: 0 auto; padding: 12px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px;
          padding: 12px 14px; margin-bottom: 10px; }
  .card .sender { font-weight: 600; color: #58a6ff; }
  .card .time { float: right; font-size: 12px; color: #8b949e; }
  .card .text { margin-top: 6px; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  #setup { max-width: 420px; margin: 15vh auto; background: #161b22; border: 1px solid #30363d;
           border-radius: 12px; padding: 24px; display: none; }
  #setup input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px;
                 border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 14px; }
  #more { display: block; margin: 14px auto; }
  .empty { text-align: center; color: #8b949e; padding: 40px 0; }
</style>
</head>
<body>
<header>
  <span id="dot" class="dot"></span>
  <h1>SMSync 短信同步</h1>
  <button id="notifyBtn">开启通知</button>
</header>

<div id="setup">
  <h2 style="margin-top:0">连接服务器</h2>
  <p style="color:#8b949e;font-size:13px">请输入访问令牌（服务器启动时打印的 token，或 server/.token 文件内容）</p>
  <input id="tokenInput" type="password" placeholder="Access Token">
  <button id="saveBtn" style="width:100%">保存并连接</button>
</div>

<main id="list"></main>
<button id="more" style="display:none">加载更早的短信</button>

<script>
const $ = id => document.getElementById(id);
let token = localStorage.getItem('smsync_token') || '';
let ws = null, oldestId = null, retryMs = 1000;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmt(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString('zh-CN', {hour12: false});
}
function render(item, prepend) {
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `<span class="time">${esc(fmt(item.received_at || item.created_at))}</span>
    <div class="sender">${esc(item.sender)}</div>
    <div class="text">${esc(item.text)}</div>`;
  prepend ? $('list').prepend(div) : $('list').append(div);
}
async function api(path) {
  const r = await fetch(path, {headers: {Authorization: 'Bearer ' + token}});
  if (r.status === 401) { localStorage.removeItem('smsync_token'); location.reload(); throw new Error('401'); }
  return r.json();
}
async function loadHistory(beforeId) {
  const q = beforeId ? `?limit=50&before_id=${beforeId}` : '?limit=50';
  const data = await api('/api/v1/sms' + q);
  if (!beforeId) $('list').innerHTML = '';
  data.items.forEach(it => render(it, false));
  if (data.items.length) {
    oldestId = data.items[data.items.length - 1].id;
    $('more').style.display = data.items.length === 50 ? 'block' : 'none';
  } else if (!beforeId) {
    $('list').innerHTML = '<div class="empty">暂无短信</div>';
    $('more').style.display = 'none';
  } else {
    $('more').style.display = 'none';
  }
}
function notify(item) {
  if (Notification.permission === 'granted') {
    const n = new Notification('新短信：' + item.sender, {body: item.text});
    n.onclick = () => window.focus();
  }
  try { new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=').play().catch(()=>{}); } catch(e) {}
}
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(token)}`);
  ws.onopen = () => { $('dot').classList.add('on'); retryMs = 1000; };
  ws.onclose = () => {
    $('dot').classList.remove('on');
    setTimeout(connect, retryMs);
    retryMs = Math.min(retryMs * 2, 30000);
  };
  ws.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'sms') { render(msg.data, true); notify(msg.data); }
  };
  // keepalive through proxies
  setInterval(() => { if (ws && ws.readyState === 1) ws.send('ping'); }, 25000);
}
function start() {
  $('setup').style.display = 'none';
  loadHistory().catch(console.error);
  connect();
}
$('saveBtn').onclick = () => {
  token = $('tokenInput').value.trim();
  if (!token) return;
  localStorage.setItem('smsync_token', token);
  start();
};
$('more').onclick = () => oldestId && loadHistory(oldestId).catch(console.error);
$('notifyBtn').onclick = async () => {
  const p = await Notification.requestPermission();
  $('notifyBtn').textContent = p === 'granted' ? '通知已开启' : '通知被拒绝';
};
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/static/sw.js').catch(()=>{});
if (token) start(); else $('setup').style.display = 'block';
if (Notification.permission === 'granted') $('notifyBtn').textContent = '通知已开启';
</script>
</body>
</html>
