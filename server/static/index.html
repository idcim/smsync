<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>SMSync 短信同步</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: #0d1117; color: #e6edf3; }
  header { position: sticky; top: 0; background: #161b22; padding: 12px 16px; z-index: 5;
           display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #30363d; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #f85149; }
  .dot.on { background: #3fb950; }
  button { background: #1f6feb; color: #fff; border: 0; border-radius: 6px;
           padding: 8px 14px; font-size: 14px; cursor: pointer; }
  nav { display: flex; background: #161b22; border-bottom: 1px solid #30363d;
        position: sticky; top: 45px; z-index: 5; }
  nav button { flex: 1; background: none; color: #8b949e; border-radius: 0;
               border-bottom: 2px solid transparent; padding: 10px 0; }
  nav button.active { color: #e6edf3; border-bottom-color: #1f6feb; }
  main { max-width: 720px; margin: 0 auto; padding: 12px; }
  .page { display: none; }
  .page.active { display: block; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px;
          padding: 12px 14px; margin-bottom: 10px; }
  .card .sender { font-weight: 600; color: #58a6ff; }
  .card .time { float: right; font-size: 12px; color: #8b949e; }
  .card .del { float: right; margin-left: 10px; border: 0; background: none; color: #8b949e;
               font-size: 15px; cursor: pointer; padding: 0 2px; line-height: 1; }
  .card .del:hover { color: #f85149; }
  .card .text { margin-top: 6px; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .card .missed { color: #f85149; }
  .card audio { width: 100%; margin-top: 8px; height: 32px; }
  #callbar { display: none; position: sticky; top: 84px; z-index: 6; margin: 12px;
             background: #1c2a3d; border: 1px solid #1f6feb; border-radius: 12px;
             padding: 14px 16px; align-items: center; gap: 10px; }
  #callbar .num { font-size: 20px; font-weight: 700; color: #58a6ff; flex: 1; }
  #callbar .st { color: #d29922; font-size: 13px; }
  .green { background: #238636; }
  .red { background: #da3633; }
  .sendform input, .sendform textarea, .sendform select { width: 100%; padding: 10px; border-radius: 6px;
      border: 1px solid #30363d; background: #0d1117; color: #e6edf3;
      font-size: 14px; outline: none; margin-bottom: 10px; }
  .sendform textarea { height: 90px; resize: vertical; }
  .outitem { font-size: 13px; }
  .st-ok { color: #3fb950; } .st-bad { color: #f85149; } .st-wait { color: #d29922; }
  #setup { max-width: 420px; margin: 15vh auto; background: #161b22; border: 1px solid #30363d;
           border-radius: 12px; padding: 24px; display: none; }
  #setup input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px;
                 border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 14px; }
  #more { display: block; margin: 14px auto; }
  .empty { text-align: center; color: #8b949e; padding: 40px 0; }
</style>
</head>
<body>
<header>
  <span id="dot" class="dot"></span>
  <h1>SMSync</h1>
  <button id="notifyBtn">开启通知</button>
  <button id="logoutBtn" style="background:#30363d">退出</button>
</header>
<nav>
  <button class="active" data-page="pageSms">短信</button>
  <button data-page="pageCalls">通话</button>
  <button data-page="pageSend">发短信</button>
</nav>

<div id="callbar">
  <span class="num" id="cbNum"></span>
  <span class="st" id="cbSt"></span>
  <button class="green" id="cbAnswer">接听</button>
  <button class="red" id="cbHangup">挂断</button>
</div>

<div id="setup">
  <h2 style="margin-top:0">登录 SMSync</h2>
  <p style="color:#8b949e;font-size:13px">使用管理员在 <a href="/admin/" style="color:#58a6ff">管理后台</a> 注册的账号登录</p>
  <input id="userInput" placeholder="用户名" autocomplete="username">
  <input id="passInput" type="password" placeholder="密码" autocomplete="current-password">
  <div style="display:flex;gap:8px;align-items:center">
    <input id="capInput" placeholder="验证码" maxlength="4" style="flex:1;margin:0 0 10px" autocomplete="off">
    <img id="capImg" alt="点击刷新验证码" title="点击刷新"
         style="height:40px;border-radius:6px;cursor:pointer;margin-bottom:10px;background:#0d1117">
  </div>
  <p id="loginErr" style="color:#f85149;font-size:13px;display:none;margin:0 0 10px"></p>
  <button id="saveBtn" style="width:100%">登录</button>
</div>

<main>
  <div class="page active" id="pageSms"><div id="list"></div>
    <button id="more" style="display:none">加载更早的短信</button></div>
  <div class="page" id="pageCalls">
    <div class="card sendform" style="display:flex;gap:8px">
      <input id="dialNum" placeholder="输入号码拨打电话…" style="margin:0;flex:1">
      <select id="dialDev" style="margin:0;max-width:130px"></select>
      <button class="green" id="dialBtn">拨打</button>
    </div>
    <div id="callList"></div>
  </div>
  <div class="page" id="pageSend">
    <div class="card sendform">
      <input id="sendTo" placeholder="收件人号码，如 +8613800138000">
      <textarea id="sendText" placeholder="短信内容（支持中文）"></textarea>
      <select id="sendDev"></select>
      <button id="sendBtn">发送</button>
    </div>
    <div id="outList"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
localStorage.removeItem('smsync_token');  // 清理旧版静态 token 残留
let token = localStorage.getItem('smsync_jwt') || '';
let ws = null, oldestId = null, retryMs = 1000, activeCall = null;
let devices = [];  // 我的设备（服务端按归属过滤）

// ---- 设备选择（多设备时指定下行目标；不选则由服务端自动路由） ----
async function loadDevices() {
  try { devices = (await api('/api/v1/devices')).items || []; } catch (e) { devices = []; }
  for (const id of ['dialDev', 'sendDev']) {
    const el = $(id);
    if (!el) continue;
    const cur = el.value;
    el.innerHTML = '<option value="">自动选择设备</option>'
      + devices.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join('');
    el.value = cur;
  }
}
function selDev(id) { const v = $(id).value; return v ? Number(v) : undefined; }
function devName(id) {
  if (devices.length < 2 || id == null) return '';
  const d = devices.find(x => x.id === id);
  return d ? ` · ${esc(d.name)}` : '';
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmt(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString('zh-CN', {hour12: false});
}
async function api(path, method = 'GET', body = null, retried = false) {
  const opt = {method, headers: {Authorization: 'Bearer ' + token}};
  if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  if (r.status === 401) {
    // access token 过期：先尝试用 refresh token 换新的一对（无状态续期）
    if (!retried && await refreshTokens()) return api(path, method, body, true);
    localStorage.removeItem('smsync_jwt');
    localStorage.removeItem('smsync_refresh');
    location.reload();
    throw new Error('401');
  }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ('HTTP ' + r.status));
  return data;
}

// access(12h) 过期后用 refresh(30d) 换新 token 对；refresh 也失效才需重新登录
async function refreshTokens() {
  const rt = localStorage.getItem('smsync_refresh');
  if (!rt) return false;
  try {
    const r = await fetch('/api/v1/auth/refresh', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: rt }),
    });
    if (!r.ok) return false;
    const d = await r.json();
    token = d.access_token;
    localStorage.setItem('smsync_jwt', d.access_token);
    localStorage.setItem('smsync_refresh', d.refresh_token);
    return true;
  } catch (e) { return false; }
}

// ---- tabs ----
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === b.dataset.page));
  if (b.dataset.page === 'pageCalls') loadCalls();
  if (b.dataset.page === 'pageSend') loadOutbox();
});

// ---- sms ----
function render(item, prepend) {
  const div = document.createElement('div');
  div.className = 'card';
  div.dataset.id = item.id;
  div.innerHTML = `<button class="del" title="删除">×</button><span class="time">${esc(fmt(item.received_at || item.created_at))}</span>
    <div class="sender">${esc(item.sender)}<span style="color:#8b949e;font-size:12px">${devName(item.device_id)}</span></div>
    <div class="text">${esc(item.text)}</div>`;
  div.querySelector('.del').onclick = async () => {
    if (!confirm('确定删除这条短信吗？')) return;
    try { await api('/api/v1/sms/' + item.id, 'DELETE'); } catch (e) {}
    removeCard(item.id);
  };
  prepend ? $('list').prepend(div) : $('list').append(div);
}
function removeCard(id) {
  const el = document.querySelector(`#list .card[data-id="${id}"]`);
  if (el) el.remove();
}
async function loadHistory(beforeId) {
  const q = beforeId ? `?limit=50&before_id=${beforeId}` : '?limit=50';
  const data = await api('/api/v1/sms' + q);
  if (!beforeId) $('list').innerHTML = '';
  data.items.forEach(it => render(it, false));
  if (data.items.length) {
    oldestId = data.items[data.items.length - 1].id;
    $('more').style.display = data.items.length === 50 ? 'block' : 'none';
  } else if (!beforeId) {
    $('list').innerHTML = '<div class="empty">暂无短信</div>';
    $('more').style.display = 'none';
  } else {
    $('more').style.display = 'none';
  }
}
function notify(title, body) {
  if (Notification.permission === 'granted') {
    const n = new Notification(title, {body});
    n.onclick = () => window.focus();
  }
}

// ---- calls ----
const CALL_STATUS = { ringing: '响铃', dialing: '拨号中', alerting: '对方响铃',
                      active: '通话中', missed: '未接', ended: '已结束', failed: '失败' };
async function loadCalls() {
  try {
    const data = await api('/api/v1/calls?limit=100');
    renderCallList(data.items);
  } catch (e) {}
}
function renderCallList(items) {
  $('callList').innerHTML = items.map(c => {
    const bad = c.status === 'missed' || c.status === 'failed';
    const dur = c.duration != null ? c.duration + 's' : (CALL_STATUS[c.status] || c.status);
    return `<div class="card" data-id="${c.id}">
      <span class="time">${esc(fmt(c.started_at || c.created_at))}</span>
      <div class="sender ${bad ? 'missed' : ''}">${c.direction === 'out' ? '📤' : '📲'} ${esc(c.number || '未知号码')}<span style="color:#8b949e;font-size:12px">${devName(c.device_id)}</span></div>
      <div class="text">${esc(dur)}${c.recording_file ? ` <a href="#" class="reclink" data-id="${c.id}">▶ 播放录音</a>` : ''}</div>
    </div>`;
  }).join('') || '<div class="empty">暂无通话记录</div>';
  document.querySelectorAll('.reclink').forEach(a => a.onclick = async (e) => {
    e.preventDefault();
    try {
      const r = await fetch(`/api/v1/calls/${a.dataset.id}/recording`,
        {headers: {Authorization: 'Bearer ' + token}});
      const url = URL.createObjectURL(await r.blob());
      const audio = document.createElement('audio');
      audio.controls = true; audio.autoplay = true; audio.src = url;
      a.replaceWith(audio);
    } catch (err) { alert('录音加载失败'); }
  });
}
function updateCallBar() {
  if (activeCall && ['ringing', 'dialing', 'alerting', 'active'].includes(activeCall.status)) {
    $('callbar').style.display = 'flex';
    $('cbNum').textContent = activeCall.number || '未知号码';
    $('cbSt').textContent = CALL_STATUS[activeCall.status] || activeCall.status;
    $('cbAnswer').style.display = activeCall.status === 'ringing' ? '' : 'none';
  } else {
    $('callbar').style.display = 'none';
  }
}
function onCallEvent(c) {
  if (['ringing', 'dialing', 'alerting', 'active'].includes(c.status)) {
    const wasIdle = !activeCall;
    activeCall = c;
    if (c.direction === 'in' && c.status === 'ringing' && wasIdle)
      notify('📞 来电', c.number || '未知号码');
  } else if (activeCall && activeCall.id === c.id) {
    activeCall = null;
  }
  updateCallBar();
  if ($('pageCalls').classList.contains('active')) loadCalls();
}
$('cbAnswer').onclick = () => api('/api/v1/calls/answer', 'POST',
  activeCall && activeCall.device_id ? { device_id: activeCall.device_id } : {}).catch(e => alert(e.message));
$('cbHangup').onclick = () => api('/api/v1/calls/hangup', 'POST',
  activeCall && activeCall.device_id ? { device_id: activeCall.device_id } : {}).catch(e => alert(e.message));
$('dialBtn').onclick = async () => {
  const num = $('dialNum').value.trim();
  if (!num) return;
  try { await api('/api/v1/calls/dial', 'POST', { number: num, device_id: selDev('dialDev') }); $('dialNum').value = ''; }
  catch (e) { alert('拨号失败：' + e.message); }
};

// ---- send sms ----
$('sendBtn').onclick = async () => {
  const to = $('sendTo').value.trim(), text = $('sendText').value.trim();
  if (!to || !text) return;
  $('sendBtn').disabled = true;
  try { await api('/api/v1/sms/send', 'POST', { to, text, device_id: selDev('sendDev') }); $('sendText').value = ''; }
  catch (e) { alert('发送失败：' + e.message); }
  $('sendBtn').disabled = false;
  loadOutbox();
};
async function loadOutbox() {
  try {
    const data = await api('/api/v1/sms/outbox/list?limit=50');
    renderOutbox(data.items);
  } catch (e) {}
}
function renderOutbox(items) {
  $('outList').innerHTML = items.map(o => {
    const [cls, label] = o.status === 'sent' ? ['st-ok', '✓ 已发送']
      : o.status === 'failed' ? ['st-bad', '✗ 失败']
      : ['st-wait', '… 发送中'];
    return `<div class="card outitem" data-id="${o.id}">
      <span class="time">${esc(fmt(o.created_at))}</span>
      <div class="sender">${esc(o.recipient)} <span class="${cls}">${esc(label)}</span></div>
      <div class="text">${esc(o.text)}</div>
    </div>`;
  }).join('') || '<div class="empty">还没有发送记录</div>';
}
function onSmsSent(row) {
  if (!$('pageSend').classList.contains('active')) return;
  const el = document.querySelector(`#outList .card[data-id="${row.id}"]`);
  if (el) { loadOutbox(); } else {
    renderOutboxPrepend(row);
  }
}
function renderOutboxPrepend(o) {
  const div = document.createElement('div');
  div.className = 'card outitem'; div.dataset.id = o.id;
  const [cls, label] = o.status === 'sent' ? ['st-ok', '✓ 已发送']
    : o.status === 'failed' ? ['st-bad', '✗ 失败'] : ['st-wait', '… 发送中'];
  div.innerHTML = `<span class="time">${esc(fmt(o.created_at))}</span>
    <div class="sender">${esc(o.recipient)} <span class="${cls}">${esc(label)}</span></div>
    <div class="text">${esc(o.text)}</div>`;
  $('outList').prepend(div);
}

// ---- websocket ----
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(token)}`);
  ws.onopen = () => { $('dot').classList.add('on'); retryMs = 1000; };
  ws.onclose = async (ev) => {
    $('dot').classList.remove('on');
    // 4401 = token 失效：先用 refresh token 续期再重连
    if (ev.code === 4401) await refreshTokens();
    setTimeout(connect, retryMs);
    retryMs = Math.min(retryMs * 2, 30000);
  };
  ws.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'sms') { render(msg.data, true); notify('新短信：' + msg.data.sender, msg.data.text); }
    else if (msg.type === 'delete') { removeCard(msg.data.id); }
    else if (msg.type === 'call') { onCallEvent(msg.data); }
    else if (msg.type === 'sms_sent') { onSmsSent(msg.data); }
  };
  setInterval(() => { if (ws && ws.readyState === 1) ws.send('ping'); }, 25000);
}
function start() {
  $('setup').style.display = 'none';
  loadHistory().catch(console.error);
  loadDevices();
  connect();
}
let captchaId = '';
async function loadCaptcha() {
  try {
    const d = await (await fetch('/api/v1/auth/captcha')).json();
    captchaId = d.captcha_id;
    $('capImg').src = d.image;
    $('capInput').value = '';
  } catch (e) { /* 网络问题，登录时会再提示 */ }
}
$('capImg').onclick = loadCaptcha;

$('saveBtn').onclick = async () => {
  const u = $('userInput').value.trim(), p = $('passInput').value, cap = $('capInput').value.trim();
  if (!u || !p || !cap) return;
  $('saveBtn').disabled = true;
  try {
    const r = await fetch('/api/v1/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p, captcha_id: captchaId, captcha_text: cap }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(
      r.status === 429 ? '失败次数过多，请 1 分钟后再试'
      : r.status === 400 ? '验证码错误或已过期'
      : (d.detail || '登录失败'));
    token = d.access_token;
    localStorage.setItem('smsync_jwt', d.access_token);
    localStorage.setItem('smsync_refresh', d.refresh_token);
    start();
  } catch (e) {
    const el = $('loginErr');
    el.textContent = e.message;
    el.style.display = 'block';
    loadCaptcha();  // 验证码一次性，无论对错都要换新
  }
  $('saveBtn').disabled = false;
};
$('logoutBtn').onclick = () => {
  localStorage.removeItem('smsync_jwt');
  localStorage.removeItem('smsync_refresh');
  location.reload();
};
$('more').onclick = () => oldestId && loadHistory(oldestId).catch(console.error);
$('notifyBtn').onclick = async () => {
  const p = await Notification.requestPermission();
  $('notifyBtn').textContent = p === 'granted' ? '通知已开启' : '通知被拒绝';
};
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/static/sw.js').catch(()=>{});
if (token) start(); else { $('setup').style.display = 'block'; loadCaptcha(); }
if (Notification.permission === 'granted') $('notifyBtn').textContent = '通知已开启';
</script>
</body>
</html>
