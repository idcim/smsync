[modem]
# 树莓派上 EC20 的 AT 口（通常 ttyUSB2，用 ls /dev/ttyUSB* 确认）
port = /dev/ttyUSB2
baudrate = 115200

[server]
url = https://smsync.h6.fan
# 设备码：在管理后台「设备管理」里创建设备获得（smsk_ 开头，只显示一次）
device_key = smsk_change-me

[agent]
heartbeat_sec = 30
flush_sec = 10
clcc_poll_sec = 2
outbox_db = outbox.db

[audio]
# 通话录音（EC20 PCM 注册成的 ALSA 声卡，arecord -l 查看）
enabled = true
device = default
rate = 8000
channels = 1
dir = recordings
