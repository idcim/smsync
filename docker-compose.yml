services:
  smsync:
    build: ./server
    container_name: smsync-server
    restart: always
    ports:
      - "8000:8000"
    environment:
      SMSYNC_TOKEN: ${SMSYNC_TOKEN}
      SMSYNC_DB: /data/smsync.db
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - smsync-data:/data
    # 安全收紧：容器以非 root 运行（见 Dockerfile），根文件系统只读，无特权
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  smsync-data:
